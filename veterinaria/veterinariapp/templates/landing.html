  <title>Bienvenidos - vEterInariA</title>
  <link rel="stylesheet" href="{% static 'src/styles_base.css' %}">
  <style>
    .landing-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .welcome-card {
      background-color: white;
      padding: 3rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    
    .welcome-title {
      font-size: 2.5rem;
      color: #2e7d32;
      margin-bottom: 1rem;
    }
    
    .welcome-description {
      color: #374151;
      font-size: 1.125rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    
    .welcome-btn {
      display: inline-block;
      background-color: #2e7d32;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.125rem;
      font-weight: 600;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background-color 0.3s ease;
      margin-top: 1rem;
    }
    
    .welcome-btn:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
