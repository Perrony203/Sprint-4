{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Veterinario - vEterInariA</title>
    <link rel="stylesheet" href="{% static 'src/styles_base.css' %}">
</head>
<body>
    {% include "topbar.html" %}
    <div class="main-container">
        <div class="card">
            <h2>👨‍⚕️ Registrar Veterinario</h2>
            <form method="post" class="form-group">
                {% csrf_token %}
                {{ form.as_p }}
                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn">💾 Guardar</button>
                    <a href="{% url 'lista_veterinarios' %}" class="btn btn-secondary">❌ Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2025 Veterinaria Vida Animal - Todos los derechos reservados</p>
    </footer>
</body>
</html>
